name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {python: "3.11", spark: "3.5.*", java: "17"}
          - {python: "3.11", spark: "4.0.*"}
          - {python: "3.11", spark: "4.1.*"}
          - {python: "3.11", spark: "4.2.*"}
          - {python: "3.11", spark: "4.3.0"}
          - {python: "3.12", spark: "4.3.0"}
          - {python: "3.13", spark: "4.3.0"}
          - {python: "3.14", spark: "4.3.0"}
        connect: [false, true]
        exclude:
          - runtime: {python: "3.11", spark: "3.5.*", java: "17"}
            connect: true
    name: Python ${{ matrix.runtime.python }}, Spark ${{ matrix.runtime.spark }}, Connect ${{ matrix.connect }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime.java || '21' }}
      - name: Install dependencies
        run: |
          python -m pip install -e ".[test]" scikit-learn "pyspark[connect]==${{ matrix.runtime.spark }}"
      - name: Run test suites
        env:
          TEST_SPARK_CONNECT: ${{ matrix.connect }}
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
          SPARK_LOCAL_IP: 127.0.0.1
        run: ./run-tests.sh
      - name: Run pylint
        run: ./run-pylint.sh

  legacy-joblib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {python: "3.11", joblib: "1.0.1"}
          - {python: "3.11", joblib: "1.0.1", spark: "3.5.*", java: "17", modes: "false"}
          - {python: "3.11", joblib: "1.1.1"}
          - {python: "3.11", joblib: "1.2.0"}
          - {python: "3.11", joblib: "1.3.2"}
          - {python: "3.11", joblib: "1.3.2", spark: "4.0.*", modes: "true"}
          - {python: "3.12", joblib: "1.4.2"}
          - {python: "3.13", joblib: "1.5.0"}
          - {python: "3.14", joblib: "1.5.3"}
    name: Python ${{ matrix.runtime.python }}, joblib ${{ matrix.runtime.joblib }}, Spark ${{ matrix.runtime.spark || '4.3.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.runtime.java || '21' }}
      - name: Install dependencies
        run: |
          python -m pip install -e ".[test]" "pyspark[connect]==${{ matrix.runtime.spark || '4.3.0' }}" "joblib==${{ matrix.runtime.joblib }}"
      - name: Test classic Spark and Spark Connect
        env:
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
          SPARK_LOCAL_IP: 127.0.0.1
          SPARK_TEST_MODES: ${{ matrix.runtime.modes || 'false true' }}
        run: |
          for mode in $SPARK_TEST_MODES; do
            TEST_SPARK_CONNECT=$mode ./run-tests.sh
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import joblibspark

          tag = os.environ.get("RELEASE_TAG")
          if tag and tag != f"v{joblibspark.__version__}":
              raise SystemExit("Release tag must match joblibspark.__version__")
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check installed namespace
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd "$(mktemp -d)"
          python -c "from importlib.metadata import version; import joblibspark; assert version('joblibspark-fabric') == joblibspark.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
