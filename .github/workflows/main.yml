name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {python: "3.13", spark: "4.0.0", joblib: "==1.5.0"}
          - {python: "3.13", spark: "4.1.*", joblib: ">=1.5.0"}
          - {python: "3.13", spark: "4.2.*", joblib: ">=1.5.0"}
          - {python: "3.13", spark: "4.3.0", joblib: ">=1.5.0"}
          - {python: "3.14", spark: "4.3.0", joblib: ">=1.5.0"}
        connect: [false, true]
    name: Python ${{ matrix.runtime.python }}, Spark ${{ matrix.runtime.spark }}, joblib ${{ matrix.runtime.joblib }}, Connect ${{ matrix.connect }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install -e ".[test]" scikit-learn "pyspark[connect]==${{ matrix.runtime.spark }}" "joblib${{ matrix.runtime.joblib }}"
      - name: Run test suites
        env:
          TEST_SPARK_CONNECT: ${{ matrix.connect }}
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
          SPARK_LOCAL_IP: 127.0.0.1
        run: ./run-tests.sh
      - name: Run pylint
        run: ./run-pylint.sh

  distributed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - {python: "3.13", spark: "4.0.0", joblib: "joblib==1.5.0"}
          - {python: "3.14", spark: "4.3.0", joblib: "joblib>=1.5.0"}
        connect: [false, true]
    name: Containers Python ${{ matrix.runtime.python }}, Spark ${{ matrix.runtime.spark }}, Connect ${{ matrix.connect }}
    env:
      COMPOSE_FILE: test/containers/compose.yml
      PYTHON_VERSION: ${{ matrix.runtime.python }}
      SPARK_VERSION: ${{ matrix.runtime.spark }}
      JOBLIB_REQUIREMENT: ${{ matrix.runtime.joblib }}
      TEST_SPARK_CONNECT: ${{ matrix.connect }}
    steps:
      - uses: actions/checkout@v4
      - name: Build shared driver and worker image
        timeout-minutes: 10
        run: docker compose build master
      - name: Start master and three worker containers
        run: |
          docker compose up -d --wait --wait-timeout 180 --scale worker=3 master worker
          if [ "$TEST_SPARK_CONNECT" = "true" ]; then
            docker compose up -d --wait --wait-timeout 300 connect
          fi
      - name: Verify distributed execution
        timeout-minutes: 12
        run: docker compose run --name joblibspark-test-driver --use-aliases driver
      - name: Collect cluster logs
        if: always()
        run: |
          docker compose logs --no-color --timestamps > cluster.log
          if docker container inspect joblibspark-test-driver > /dev/null 2>&1; then
            docker logs --timestamps joblibspark-test-driver > driver.log 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cluster-logs-${{ matrix.runtime.python }}-${{ matrix.runtime.spark }}-${{ matrix.connect }}
          path: |
            cluster.log
            driver.log
      - name: Stop cluster
        if: always()
        run: docker compose down --volumes --remove-orphans

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import joblibspark

          tag = os.environ.get("RELEASE_TAG")
          if tag and tag != f"v{joblibspark.__version__}":
              raise SystemExit("Release tag must match joblibspark.__version__")
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check installed namespace
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd "$(mktemp -d)"
          python -c "from importlib.metadata import version; import joblibspark; assert version('joblibspark-fabric') == joblibspark.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
